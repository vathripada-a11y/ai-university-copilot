# =============================================================================
# Application Configuration
# =============================================================================
spring.application.name=campuscopilot
server.port=${PORT:8080}

# =============================================================================
# Database Configuration (MySQL 8)
# Environment variables DB_URL, DB_USER, DB_PASSWORD with safe development defaults
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_copilot?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
# initialization-fail-timeout=-1 allows the app to start without failing immediately if DB is temporarily unreachable
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# =============================================================================
# Security & JWT Configuration
# JWT Secret with environment variable override and safe development default
# =============================================================================
app.jwt.secret=${JWT_SECRET:dev_secret_key_change_in_production_min_256_bits_length_1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =============================================================================
# OpenAPI / Swagger UI
# =============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
